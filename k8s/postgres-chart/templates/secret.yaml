apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.name" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.name" . }}-init
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  10-create-user-and-databases.sql: |
    CREATE ROLE {{ .Values.program.username }} WITH LOGIN PASSWORD '{{ .Values.program.password }}';
    {{- range .Values.databases }}

    CREATE DATABASE {{ . }} OWNER {{ $.Values.program.username }};
    GRANT ALL PRIVILEGES ON DATABASE {{ . }} TO {{ $.Values.program.username }};
    {{- end }}
